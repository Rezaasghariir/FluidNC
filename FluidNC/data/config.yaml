board: ESP32_V4
name: ESP32_V4_GRBL_LASER_RMT


stepping:
  engine: RMT
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 0
  disable_delay_us: 0
  segments: 12

kinematics:
  Cartesian:

axes:
  shared_stepper_disable_pin: NO_PIN 
  shared_stepper_reset_pin: NO_PIN
  homing_runs: 2
  
  x:
    steps_per_mm: 159.0
    max_rate_mm_per_min: 15000.0
    acceleration_mm_per_sec2: 8000.0
    max_travel_mm: 620.0
    soft_limits: false
    
    motor0:
      standard_stepper:
        step_pin: gpio.13
        direction_pin: gpio.27:low 
        disable_pin: NO_PIN 

      limit_neg_pin: gpio.18:low
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: true
      pulloff_mm: 3.0
      homing_dir: -1
    homing:
      cycle: 2
      allow_single_axis: true
      positive_direction: false
      mpos_mm: 1.000
      seek_mm_per_min: 800
      feed_mm_per_min: 100
      seek_scaler: 1.5
      feed_scaler: 1.5
      
  y:
    steps_per_mm: 159.0
    max_rate_mm_per_min: 8000.0
    acceleration_mm_per_sec2: 600.0
    max_travel_mm: 410.0
    soft_limits: false
    
    motor0:
      standard_stepper:
        step_pin: gpio.26
        direction_pin: gpio.25:low 
        disable_pin: NO_PIN 

      limit_neg_pin: gpio.5:low
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: true
      pulloff_mm: 3.0
      homing_dir: -1
    homing:
      cycle: 2
      allow_single_axis: true
      positive_direction: false
      mpos_mm: 1.000
      seek_mm_per_min: 800
      feed_mm_per_min: 100
      seek_scaler: 1.5
      feed_scaler: 1.5

  z:
    motor0:
      null_motor: 
    
# *** تعریف لیزر بر اساس سبک جدید (کلید ریشه Laser) ***
# SPINDLE_TYPE = SpindleType::LASER
Laser:
  # DEFAULT_SPINDLE_FREQ = 100000.0 (این را به 100K تغییر می‌دهیم تا با config.h اصلی مطابقت داشته باشد)
  pwm_hz: 100000
  # LASER_OUTPUT_PIN = GPIO_NUM_16
  output_pin: gpio.16
  enable_pin: NO_PIN
  disable_with_s0: false
  s0_with_disable: true
  tool_num: 0
  # این speed_map باید با DEFAULT_LASER_FULL_POWER (1000) و DEFAULT_SPINDLE_MIN_VALUE (50) تنظیم شود.
  # 50 برای حداقل توان (S0)، 1000 برای حداکثر توان (Smax)
  speed_map: 0=0.000% 1=63.000% 1000=100.000%
  off_on_alarm: true
  M6_macro: '' # ماکرو را خالی می‌گذاریم مگر اینکه نیاز باشد

control:
  safety_door_pin: NO_PIN
  reset_pin: NO_PIN
  feed_hold_pin: NO_PIN
  cycle_start_pin: NO_PIN
  macro0_pin: NO_PIN
  macro1_pin: NO_PIN
  macro2_pin: NO_PIN
  macro3_pin: NO_PIN
  fault_pin: NO_PIN
  estop_pin: NO_PIN

probe:
  pin: NO_PIN
  toolsetter_pin: NO_PIN
  check_mode_start: true
  hard_stop: false

coolant:
  flood_pin: NO_PIN
  mist_pin: NO_PIN
  delay_ms: 0

start:
  must_home: true 
  deactivate_parking: false
  check_limits: true

arc_tolerance_mm: 0.002000
junction_deviation_mm: 0.010000
verbose_errors: true
report_inches: false
enable_parking_override_control: false
use_line_numbers: false
planner_blocks: 16
